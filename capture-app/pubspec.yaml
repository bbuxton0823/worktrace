name: egodata_app
description: Worktrace — egocentric capture for robot training data
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  cross_file: ^0.3.4+2
  uvccamera:
    path: third_party/uvccamera
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  video_player: ^2.8.0
  http: ^1.1.0
  mime: ^1.0.4
  google_mlkit_pose_detection: ^0.15.0
  wakelock_plus: ^1.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  flutter_riverpod: ^2.4.0
  uuid: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
